[workspace]
resolver = "2"
members = [
    "bot",
    "api-server",
    "worker",
    "Migration",
    "shared",
    "kasuki-macros",
    'image_generation'
]


[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Valgul <contact@valgul.moe>"]
readme = "../readme.md"
repository = "https://github.com/ValgulNecron/kasuki"
license-file = "../LICENSE"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }

regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "multipart", "blocking", "form", "query"] }
serde = "1.0.229"
serde_json = "1.0.151"
serenity = { git = "https://github.com/serenity-rs/serenity.git", branch = "next", default-features = false, features = ["gateway", "rustls_backend", "model", "utils", "full", "voice", "cache", "http", "unstable"] }
rand = "0.10.2"
chrono = "0.4.45"
uuid = { version = "1.26.0", features = ["v4"] }
image = "0.25.10"
base64 = "0.23.1"
tracing = { version = "0.1.44" }
once_cell = "1.21.4"
tracing-subscriber = { version = "0.3.23", features = ["default", "env-filter"] }
serde_with = { version = "3.22.0", features = ["macros"] }
palette = "0.7.7"
tracing-appender = "0.2.5"
rayon = "1.12.0"
markdown_converter = "0.3.4"
futures = "0.3.34"
rapidfuzz = "0.5.0"
cynic = { version = "3.14.0", features = ["reqwest", "http-reqwest", "serde_json"] }
moka = { version = "0.12.16", features = ["future"] }
toml = "1.1.4"
num-bigint = "0.5.1"
songbird = { git = "https://github.com/serenity-rs/songbird.git", branch = "serenity-next", features = ["serenity", "rustls", "builtin-queue", "gateway", "receive", "driver"] }
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
serde_urlencoded = "0.7.1"
tempfile = "3.27.0"
anyhow = "1.0.104"
small-fixed-array = "0.4.10"
lavalink-rs = { git = "https://gitlab.com/vicky5124/lavalink-rs/", branch = "main", features = ["serenity"] }
async-trait = "0.1.92"
dashmap = "6.2.1"
bytes = "1.12.1"
rust-fuzzy-search = "0.1.1"
governor = { version = "0.10.4", features = ["std"] }
tower = { version = "0.5", features = ["limit"] }
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7.0", features = ["cors"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
shared = { path = "shared" }
fluent-templates = "0.15.1"
unic-langid = "0.9.6"
fluent-syntax = "0.12.0"
walkdir = "2.5.0"
cynic-codegen = "3.14.0"
inventory = "0.3.24"
syn = { version = "3.0.4", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
kasuki-macros = { path = "kasuki-macros" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
redis = { version = "1.6.0", features = ["aio", "tokio-comp"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "tracing", "reqwest", "rustls"] }
parking_lot = "0.12.5"
arc-swap = "1.9.2"
libc = "0.2"
rust-s3 = { version = "0.37.2", default-features = false, features = ["fail-on-err", "tokio-rustls-tls"] }

[patch.crates-io]
serenity = { git = "https://github.com/serenity-rs/serenity.git", branch = "next" }

[profile.dev]
debug = 2

[profile.release]
lto = true
strip = true
opt-level = 3
panic = "abort"
codegen-units = 1
